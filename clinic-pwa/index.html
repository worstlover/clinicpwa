<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d6efd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="کلینیک">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<!-- ⬅️ آیکون سایت برای رفع خطای 404 -->
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>کلینیک گندله سازی بهاباد</title>

<link href="lib/vazirmatn.css" rel="stylesheet">
<link href="lib/bootstrap.rtl.min.css" rel="stylesheet">
<link href="lib/bootstrap-icons.min.css" rel="stylesheet">
<link href="styles/theme.css" rel="stylesheet"> 
<link href="js/forms/print.css" rel="stylesheet">
<link href="js/forms/forms-theme.css" rel="stylesheet">
<link href="js/process/process.css" rel="stylesheet">

<style>
  .screen { display: none !important; }
  .screen.active { display: block !important; }
  #screenLoading { display: none; }
  #screenLoading.active { display: block !important; }
</style>
</head>
<body>

<!-- ═════════════ لودینگ ═════════════ -->
<div id="screenLoading" class="screen active">
  <div class="loading-wrapper text-center pt-5">
    <h2 class="loading-title text-success fw-bold">کلینیک گندله</h2>
    <div class="spinner-border text-success mt-4" role="status"></div>
  </div>
</div>

<!-- ═════════════ لاگین ═════════════ -->
<div id="screenLogin" class="screen">
  <div class="login-wrapper p-4 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="login-card bg-white p-4 rounded-4 shadow-lg w-100" style="max-width: 400px;">
      <h3 class="text-center fw-bold mb-4">ورود به کلینیک</h3>
      <div id="loginMsg"></div>
      <div class="mb-3">
        <label class="form-label">نام کاربری</label>
        <input type="text" id="loginEmail" class="form-control" placeholder="نام کاربری" dir="ltr">
      </div>
      <div class="mb-4">
        <label class="form-label">رمز عبور</label>
        <input type="password" id="loginPass" class="form-control" dir="ltr" placeholder="••••••••">
      </div>
      <button class="btn btn-success w-100 btn-lg rounded-pill" id="btnLogin" type="button">ورود</button>
    </div>
  </div>
</div>

<!-- ═════════════ هدر ═════════════ -->
<div class="app-header hidden d-flex justify-content-between align-items-center p-3" id="appHeader" style="background: var(--bg-app); border-bottom: 1px solid var(--border-color);">
  <div class="d-flex align-items-center gap-3">
    <button id="btnBack" class="hidden btn btn-light rounded-circle"><i class="bi bi-arrow-right"></i></button>
    <div class="title fw-bold fs-5" id="headerTitle" style="color: var(--text-main);">کلینیک</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="btnToggleTheme" title="تغییر تم" class="btn btn-light rounded-circle"><i class="bi bi-moon-stars-fill"></i></button>
    <button id="btnAlertBell" class="btn btn-light rounded-circle position-relative">
      <i class="bi bi-bell-fill"></i>
      <span id="alertBellBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">!</span>
    </button>
    <button id="btnProfile" class="btn btn-light rounded-circle"><i class="bi bi-person-circle"></i></button>
    <button id="btnLogout" class="btn btn-light rounded-circle text-danger"><i class="bi bi-box-arrow-left"></i></button>
  </div>
</div>

<!-- ═════════════ منوی اصلی (Home) ═════════════ -->
<div id="screenHome" class="screen">
  <div class="container-fluid p-0">
    
    <!-- بخش سلام -->
    <div class="home-greeting">
      <div>
        <div class="home-greeting-text">سلام 👋</div>
        <div class="home-greeting-email" id="userEmail">admin@clinic.local</div>
      </div>
      <div style="font-size: 2.5rem; color: var(--primary); filter: drop-shadow(0 4px 6px rgba(16,185,129,0.3));">
        <i class="bi bi-flower1"></i>
      </div>
    </div>

    <!-- بنر حادثه -->
    <button id="btnQuickIncident" class="home-incident-btn">
      <div class="home-incident-icon"><i class="bi bi-alarm-fill"></i></div>
      <div class="home-incident-body">
        <div class="home-incident-title">اعلام حادثه سریع</div>
        <div class="home-incident-sub">گزارش سریع حادثه و درخواست کمک فوری</div>
      </div>
    </button>

    <!-- ⭐ گرید اصلی با چینش جدید ⭐ -->
    <div class="home-dashboard-grid">
      
      <!-- ردیف اول: 4 کارت -->
      <button class="home-card" data-nav="visits">
        <div class="home-card-icon" style="background:var(--card-1-bg);color:var(--card-1-color);"><i class="bi bi-clipboard2-pulse-fill"></i></div>
        <div class="home-card-label">ویزیت‌ها</div>
        <div class="home-card-sub">مدیریت بیماران</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <button class="home-card" data-nav="patients">
        <div class="home-card-icon" style="background:var(--card-2-bg);color:var(--card-2-color);"><i class="bi bi-people-fill"></i></div>
        <div class="home-card-label">مدیریت بیماران</div>
        <div class="home-card-sub">پرونده و سوابق</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <button class="home-card" data-nav="occupational">
        <div class="home-card-icon" style="background:var(--card-3-bg);color:var(--card-3-color);"><i class="bi bi-briefcase-fill"></i></div>
        <div class="home-card-label">طب کار</div>
        <div class="home-card-sub">معاینات شغلی</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <button class="home-card" data-nav="fineReward">
        <div class="home-card-icon" style="background:var(--card-4-bg);color:var(--card-4-color);"><i class="bi bi-shield-exclamation"></i></div>
        <div class="home-card-label">جریمه و تشویقی</div>
        <div class="home-card-sub">سوابق ایمنی</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <!-- ردیف دوم: فرم‌ها (تکی و تمام عرض) -->
      <button class="home-card card-full" data-nav="formsMenu">
        <div class="home-card-icon" style="background:#ede9fe;color:#7c3aed;">
          <i class="bi bi-file-earmark-text-fill"></i>
        </div>
        <div class="home-card-body">
          <div class="home-card-label">فرآیندها و فرم‌ها</div>
          <div class="home-card-sub">دسترسی به فرم‌ها، راهنما و بایگانی</div>
          <div class="d-inline-flex mt-2" style="font-size:0.75rem; font-weight:bold; color:var(--primary); background:var(--primary-light); padding:4px 12px; border-radius:20px;">
            مدیریت فرم‌ها <i class="bi bi-chevron-left ms-1"></i>
          </div>
        </div>
      </button>

      <!-- ردیف سوم: داروخانه و گزارش ویزیت‌ها (کنار هم) -->
      <button class="home-card card-half" data-nav="pharmacy">
        <div class="home-card-icon" style="background:#d1fae5;color:#059669;">
          <i class="bi bi-capsule-pill"></i>
        </div>
        <div class="home-card-label">داروخانه کلینیک</div>
        <div class="home-card-sub">مدیریت داروها و موجودی</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <button class="home-card card-half" data-nav="visitReports">
        <div class="home-card-icon" style="background:#fef3c7;color:#d97706;">
          <i class="bi bi-file-earmark-bar-graph"></i>
        </div>
        <div class="home-card-label">گزارش ویزیت‌ها</div>
        <div class="home-card-sub">گزارش جامع با فیلتر تاریخ</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <!-- ردیف چهارم: سایر (من و گزارش دارو) -->
      <button class="home-card card-half" data-nav="report">
        <div class="home-card-icon" style="background:#cffafe;color:#0891b2;">
          <i class="bi bi-graph-up-arrow"></i>
        </div>
        <div class="home-card-label">گزارش دارو</div>
        <div class="home-card-sub">موجودی و هشدارها</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

      <button class="home-card card-half" data-nav="profile">
        <div class="home-card-icon" style="background:#f1f5f9;color:#475569;">
          <i class="bi bi-person-badge-fill"></i>
        </div>
        <div class="home-card-label">پروفایل</div>
        <div class="home-card-sub">حساب کاربری</div>
        <i class="bi bi-chevron-left home-card-arrow"></i>
      </button>

    </div>

    <button id="btnInstallPWA" class="btn btn-outline-success w-100 mb-5 rounded-pill px-4" style="max-width:300px; margin: 0 auto; display:none;" onclick="window._triggerInstall()">
      <i class="bi bi-download"></i> نصب اپلیکیشن
    </button>
  </div>
</div>

<!-- ═════════════ صفحات دیگر ═════════════ -->
<div id="screenPharmacy" class="screen"><div class="content p-3" id="pharmacyContent"></div></div>
<div id="screenVisit"          class="screen"><div class="content p-3" id="visitContent"></div></div>
<div id="screenPatients"       class="screen"><div class="content p-3" id="patientContent"></div></div>
<div id="screenInventory"      class="screen"><div class="content p-3" id="invContent"></div></div>
<div id="screenReceive"        class="screen"><div class="content p-3" id="recvContent"></div></div>
<div id="screenDisposal"       class="screen"><div class="content p-3" id="disp2Content"></div></div>
<div id="screenReport"         class="screen"><div class="content p-3" id="repContent"></div></div>
<div id="screenProfile"        class="screen"><div class="content p-3" id="profileContent"></div></div>
<div id="screenOccupational"   class="screen"><div class="content p-3" id="occContent"></div></div>
<div id="screenForms"          class="screen"><div class="content p-3" id="formsContent"></div></div>
<div id="screenFormsMenu"      class="screen"><div class="content p-3" id="formsMenuContent"></div></div>
<div id="screenFormsArchive"   class="screen"><div class="content p-3" id="formsArchiveContent"></div></div>
<div id="screenGuide"          class="screen"><div class="content p-3" id="guideContent"></div></div>
<div id="screenVisitReports"   class="screen"><div class="content p-3" id="visitReportsContent"></div></div>
<div id="screenFineReward"     class="screen"><div class="content p-3" id="fineRewardContent"></div></div>

<!-- ═════════════ منوی پایین ═════════════ -->
<div class="bottom-nav" id="bottomNav">
  <a href="#" data-nav="home" class="active"><i class="bi bi-house-door-fill"></i>خانه</a>
  <a href="#" data-nav="visits"><i class="bi bi-calendar2-check"></i>ویزیت</a>
  <a href="#" data-nav="pharmacy" class="nav-fab"><i class="bi bi-plus-lg"></i></a>
  <a href="#" data-nav="patients"><i class="bi bi-people"></i>بیماران</a>
  <a href="#" data-nav="profile"><i class="bi bi-person"></i>پروفایل</a>
</div>

<!-- ═════════════ اسکریپت‌ها ═════════════ -->
<!-- ⭐ فایربیس دقیقاً قبل از app.js قرار گرفت ⭐ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<script src="lib/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  // کد تغییر تم (Dark Mode)
  document.addEventListener('DOMContentLoaded', () => {
    const btnTheme = document.getElementById('btnToggleTheme');
    const iconTheme = btnTheme.querySelector('i');
    const isDark = localStorage.getItem('theme') === 'dark';
    
    if (isDark) {
      document.body.classList.add('dark-mode');
      iconTheme.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
    }

    btnTheme.onclick = () => {
      document.body.classList.toggle('dark-mode');
      const darkNow = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', darkNow ? 'dark' : 'light');
      iconTheme.className = darkNow ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    };
  });
</script>
</body>
</html>
