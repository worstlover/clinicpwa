<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>دیباگ PWA و اسکنر</title>
<style>
  body{font-family:system-ui,Tahoma,sans-serif;margin:0;padding:12px;background:#fafafa;font-size:14px}
  h3,h4{margin:12px 0 6px}
  #out div,#res div{padding:5px 8px;margin:3px 0;border-radius:6px;background:#fff;border:1px solid #ddd;word-break:break-all;white-space:pre-wrap}
  .ok{border-color:#2e9d4f!important}.bad{border-color:#d33!important;background:#fff0f0!important}
  .warn{border-color:#e0a000!important;background:#fff9e5!important}
  button{padding:10px 14px;margin:4px 2px;border:0;border-radius:8px;background:#0d6efd;color:#fff;font-size:14px}
  button:disabled{background:#999}
  video{width:100%;max-height:50vh;background:#000;border-radius:8px}
  #found{font-size:16px;font-weight:bold;background:#e8f7ec;padding:8px;border-radius:8px;word-break:break-all}
</style>
</head>
<body>
<h3>۱) بررسی نصب PWA</h3>
<button id="btnInstall" disabled>نصب برنامه</button>
<button id="btnCopy">کپی گزارش</button>
<div id="out"></div>

<h4>۲) تست دوربین و QR (بدون کتابخانه)</h4>
<button id="btnCam">شروع دوربین</button>
<button id="btnTorch" disabled>چراغ‌قوه</button>
<input type="file" id="file" accept="image/*" style="margin:6px 0">
<div><label>زوم: <input type="range" id="zoom" min="1" max="5" step="0.1" value="1" disabled></label></div>
<video id="v" playsinline muted autoplay></video>
<div id="found">هنوز چیزی خوانده نشده</div>
<div id="res"></div>

<script>
const out = document.getElementById('out');
const res = document.getElementById('res');
const report = [];
function log(t, s = 'i', box = out) {
  const d = document.createElement('div');
  d.className = s;
  d.textContent = ({ ok: '✅ ', warn: '⚠️ ', bad: '❌ ', i: 'ℹ️ ' })[s] + t;
  box.appendChild(d);
  report.push(d.textContent);
}
const rlog = (t, s = 'i') => log(t, s, res);

document.getElementById('btnCopy').onclick = () => {
  navigator.clipboard?.writeText(report.join('\n')).then(() => alert('کپی شد'), () => alert('کپی نشد'));
};

// ---------- نصب ----------
let deferred = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  log('beforeinstallprompt آمد → مرورگر برنامه را قابل نصب می‌داند', 'ok');
  document.getElementById('btnInstall').disabled = false;
});
window.addEventListener('appinstalled', () => log('نصب کامل شد (appinstalled)', 'ok'));
document.getElementById('btnInstall').onclick = async () => {
  if (!deferred) return;
  deferred.prompt();
  const r = await deferred.userChoice;
  log('انتخاب کاربر: ' + r.outcome, 'i');
};

async function headCheck(url) {
  const r = await fetch(url, { cache: 'no-store' });
  return { r, ct: r.headers.get('content-type') || '' };
}

(async () => {
  log('آدرس: ' + location.href);
  log('مرورگر: ' + navigator.userAgent);

  // امنیت
  if (location.protocol === 'https:' || location.hostname === 'localhost')
    log('پروتکل: ' + location.protocol, 'ok');
  else log('سایت HTTPS نیست! بدون HTTPS نه PWA نصب می‌شود نه دوربین کار می‌کند', 'bad');
  log('isSecureContext = ' + isSecureContext, isSecureContext ? 'ok' : 'bad');

  const standalone = matchMedia('(display-mode: standalone)').matches;
  log('حالت نمایش standalone: ' + standalone + (standalone ? ' (الان داخل برنامه نصب‌شده‌اید)' : ' (داخل مرورگر)'), 'i');

  // manifest
  if (!document.querySelector('link[rel=manifest]')) log('تگ link manifest در این صفحه نیست', 'bad');
  let man = null, manUrl = new URL('manifest.json', location.href).href;
  try {
    const { r, ct } = await headCheck('manifest.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    log('manifest.json دریافت شد (' + ct + ')', /json/.test(ct) ? 'ok' : 'warn');
    man = await r.json();
  } catch (e) { log('manifest.json خوانده نشد: ' + e.message, 'bad'); }

  if (man) {
    ['name', 'short_name', 'start_url', 'display'].forEach(k =>
      log(k + ' = ' + man[k], man[k] ? 'ok' : 'bad'));
    log('display مجاز: ' + man.display, ['standalone', 'fullscreen', 'minimal-ui'].includes(man.display) ? 'ok' : 'bad');
    try {
      const st = await fetch(new URL(man.start_url, manUrl), { cache: 'no-store' });
      log('start_url باز شد: HTTP ' + st.status, st.ok ? 'ok' : 'bad');
    } catch (e) { log('start_url باز نشد: ' + e.message, 'bad'); }

    const icons = man.icons || [];
    let has192 = false, has512 = false;
    for (const ic of icons) {
      const u = new URL(ic.src, manUrl).href;
      try {
        const { r, ct } = await headCheck(u);
        if (!r.ok) { log('آیکن ' + ic.src + ' → HTTP ' + r.status + ' (فایل روی سرور نیست)', 'bad'); continue; }
        const bmp = await createImageBitmap(await r.blob());
        const real = bmp.width + 'x' + bmp.height;
        const okSize = real === ic.sizes;
        log('آیکن ' + ic.src + ' → ' + ct + ' ، اندازه واقعی ' + real + ' ، اعلام‌شده ' + ic.sizes, okSize ? 'ok' : 'bad');
        if (bmp.width >= 192 && bmp.width === bmp.height && /png/.test(ct)) has192 = true;
        if (bmp.width >= 512 && bmp.width === bmp.height && /png/.test(ct)) has512 = true;
      } catch (e) { log('آیکن ' + ic.src + ' خطا: ' + e.message, 'bad'); }
    }
    log('آیکن PNG حداقل ۱۹۲: ' + has192, has192 ? 'ok' : 'bad');
    log('آیکن PNG حداقل ۵۱۲: ' + has512, has512 ? 'ok' : 'bad');
  }

  // index.html
  try {
    const t = await (await fetch('index.html', { cache: 'no-store' })).text();
    log('index.html شامل link manifest: ' + /rel=["']manifest["']/.test(t), /rel=["']manifest["']/.test(t) ? 'ok' : 'bad');
    log('index.html شامل serviceWorker.register: ' + /serviceWorker\s*\.\s*register/.test(t), /serviceWorker\s*\.\s*register/.test(t) ? 'ok' : 'bad');
  } catch (e) { log('index.html خوانده نشد: ' + e.message, 'warn'); }

  // service worker
  if (!('serviceWorker' in navigator)) log('serviceWorker پشتیبانی نمی‌شود', 'bad');
  else {
    try {
      const { r, ct } = await headCheck('service-worker.js');
      log('service-worker.js: HTTP ' + r.status + ' (' + ct + ')', r.ok && /javascript/.test(ct) ? 'ok' : 'bad');
    } catch (e) { log('service-worker.js در دسترس نیست: ' + e.message, 'bad'); }

    const regs = await navigator.serviceWorker.getRegistrations();
    if (!regs.length) log('هیچ Service Worker ثبت نشده → این دلیل نصب نشدن است', 'bad');
    regs.forEach(g => {
      const w = g.active || g.waiting || g.installing;
      log('SW ثبت‌شده: scope=' + g.scope + ' ، state=' + (w && w.state) + ' ، script=' + (w && w.scriptURL),
        g.active ? 'ok' : 'warn');
    });
    log('صفحه توسط SW کنترل می‌شود: ' + !!navigator.serviceWorker.controller, navigator.serviceWorker.controller ? 'ok' : 'warn');

    for (const k of await caches.keys()) {
      const c = await caches.open(k);
      log('کش «' + k + '» ← ' + (await c.keys()).length + ' فایل', 'i');
    }
  }

  setTimeout(() => {
    if (!deferred && !standalone)
      log('تا الان beforeinstallprompt نیامده. اگر همه موارد بالا سبز است: برنامه قبلاً نصب شده، یا مرورگر کروم نیست، یا ۳۰ ثانیه صبر کنید و صفحه را یک بار دیگر باز کنید', 'warn');
  }, 4000);
})();

// ---------- دوربین و QR ----------
const v = document.getElementById('v');
const found = document.getElementById('found');
let stream = null, track = null, detector = null, timer = null;

function showFound(code) {
  found.textContent = 'خوانده شد (' + code.rawValue.length + ' کاراکتر):\n' + code.rawValue;
}

async function makeDetector() {
  if (!('BarcodeDetector' in window)) { rlog('BarcodeDetector در این مرورگر نیست', 'warn'); return null; }
  const f = await BarcodeDetector.getSupportedFormats();
  rlog('فرمت‌های پشتیبانی‌شده: ' + f.join(', '), 'ok');
  return new BarcodeDetector({ formats: ['qr_code', 'data_matrix'].filter(x => f.includes(x)) });
}

document.getElementById('file').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  detector = detector || await makeDetector();
  if (!detector) return;
  const codes = await detector.detect(await createImageBitmap(file));
  if (codes.length) { showFound(codes[0]); rlog('QR داخل عکس خوانده شد', 'ok'); }
  else rlog('داخل این عکس QR خوانده نشد (عکس واضح‌تر/نزدیک‌تر بگیرید)', 'bad');
};

document.getElementById('btnCam').onclick = async () => {
  res.innerHTML = '';
  if (!navigator.mediaDevices?.getUserMedia) {
    rlog('navigator.mediaDevices وجود ندارد → تقریباً حتماً HTTPS نیست', 'bad'); return;
  }
  try {
    const p = await navigator.permissions.query({ name: 'camera' });
    rlog('مجوز دوربین: ' + p.state, p.state === 'denied' ? 'bad' : 'ok');
  } catch (e) { rlog('وضعیت مجوز قابل خواندن نیست', 'warn'); }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (e) { rlog('getUserMedia خطا: ' + e.name + ' - ' + e.message, 'bad'); return; }

  track = stream.getVideoTracks()[0];
  rlog('دوربین: ' + track.label, 'ok');
  const s = track.getSettings();
  rlog('رزولوشن واقعی: ' + s.width + 'x' + s.height + ' ، facingMode=' + s.facingMode, 'i');
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  rlog('focusMode: ' + JSON.stringify(caps.focusMode) + ' ، torch: ' + !!caps.torch + ' ، zoom: ' + JSON.stringify(caps.zoom), 'i');

  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  rlog('تعداد دوربین‌ها: ' + devs.length + ' → ' + devs.map(d => d.label || '(بدون نام)').join(' | '), devs.length ? 'ok' : 'bad');

  v.srcObject = stream; await v.play();

  if (caps.torch) { const b = document.getElementById('btnTorch'); b.disabled = false; let on = false;
    b.onclick = () => track.applyConstraints({ advanced: [{ torch: on = !on }] }); }
  if (caps.zoom) { const z = document.getElementById('zoom'); z.disabled = false;
    z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
    z.oninput = () => track.applyConstraints({ advanced: [{ zoom: +z.value }] }); }

  detector = detector || await makeDetector();
  if (!detector) return;
  clearInterval(timer);
  let frames = 0;
  timer = setInterval(async () => {
    try {
      frames++;
      const codes = await detector.detect(v);
      if (codes.length) showFound(codes[0]);
      else if (frames % 25 === 0) rlog('هنوز چیزی خوانده نشد (' + frames + ' فریم تست شد)', 'warn');
    } catch (e) { rlog('detect خطا: ' + e.message, 'bad'); clearInterval(timer); }
  }, 200);
};
</script>
</body>
</html>
