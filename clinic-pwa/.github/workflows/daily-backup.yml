name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 3 * * *'   # هر روز ساعت ۳ صبح UTC (۶:۳۰ صبح تهران)
  workflow_dispatch:        # اجازه اجرای دستی از تب Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/postgresql.asc
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create backup
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M")
          mkdir -p backups
          pg_dump \
            -h "$PGHOST" \
            -p 5432 \
            -U "$PGUSER" \
            -d "$PGDATABASE" \
            --no-owner \
            --no-privileges \
            --format=plain \
            -f "backups/clinic-backup-${TIMESTAMP}.sql"
          gzip "backups/clinic-backup-${TIMESTAMP}.sql"
          ls -lh backups/

      - name: Send email with backup
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "بکاپ روزانه داروخانه - ${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: Clinic Backup
          body: |
            بکاپ روزانه دیتابیس داروخانه با موفقیت گرفته شد.
            
            تاریخ: $(date +"%Y-%m-%d %H:%M")
            فایل ضمیمه: clinic-backup-*.sql.gz
            
            این ایمیل به صورت خودکار ارسال شده است.
          attachments: backups/*.sql.gz
